<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Uma Club Member Finder</title>

  <style>
    body {
      max-width: 1200px;
      margin: auto;
      padding: 24px;

      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
    }

    h1 {
      margin-bottom: 20px;
    }

    input,
    button {
      width: 100%;
      box-sizing: border-box;

      margin-top: 10px;
      margin-bottom: 16px;
      padding: 12px;

      border: 1px solid #444;
      border-radius: 6px;

      background: #1b1b1b;
      color: white;
      font-size: 14px;
    }

    button {
      border: none;
      cursor: pointer;

      background: #2d6cdf;
      font-weight: bold;
    }

    button:hover {
      background: #3a7cff;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-bottom: 12px;
      color: #aaa;
    }

    .table-wrapper {
      overflow-x: auto;

      border: 1px solid #444;
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;

      background: #1b1b1b;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 10;

      background: #222;
    }

    th,
    td {
      padding: 10px;

      border-bottom: 1px solid #333;

      text-align: left;
      font-size: 14px;
    }

    tr:hover {
      background: #1a1a1a;
    }

    /*
      Highlight rows where the previous club and current club match.
      These players are likely still in the same club.
    */
    .same-club-row {
      background: rgba(255, 215, 0, 0.12);
    }

    .same-club-row:hover {
      background: rgba(255, 215, 0, 0.2);
    }

    /*
      Trainer IDs can be clicked to copy them to clipboard.
    */
    .copyable-id {
      cursor: pointer;

      color: #7db4ff;
      font-weight: bold;
    }

    .copyable-id:hover {
      text-decoration: underline;
    }

    .copy-flash {
      animation: copyFlash 0.4s ease;
    }

    @keyframes copyFlash {
      0% {
        background: rgba(255, 255, 255, 0.35);
      }

      100% {
        background: transparent;
      }
    }
  </style>
</head>

<body>

  <h1>Uma Club Member Finder</h1>

  <p>Enter your uma.moe API key</p>

  <input
    id="apiKey"
    type="password"
    placeholder="E.g.: uma_k_nzM..."
  />

  <p>Select a page (0 - 1000)</p>

  <input
    id="pageInput"
    type="number"
    min="0"
    max="1000"
    value="0"
    placeholder="Circle list page (0-1000)"
  />

  <div style="display: flex; gap: 10px; margin-bottom: 16px;">
    <button id="searchBtn">
      Start Search
    </button>

    <button id="pauseBtn" disabled>
      Pause
    </button>

    <button id="resumeBtn" disabled>
      Resume
    </button>

    <button id="stopBtn" disabled>
      Stop
    </button>

    <button id="exportBtn" disabled>
      Export CSV
    </button>
  </div>

  <div class="status">
    <div id="clubStatus">Idle.</div>
    <div id="detailStatus"></div>
  </div>

  <div class="table-wrapper">
    <table id="resultsTable">
      <thead>
        <tr>
          <th>Trainer ID</th>
          <th>Trainer Name</th>
          <th>Previous Club</th>
          <th>Current Club</th>
          <th>3D Gain</th>
          <th>7D Gain</th>
          <th>30D Gain</th>
        </tr>
      </thead>

      <tbody id="resultsBody"></tbody>
    </table>
  </div>

  <script>
    const API_BASE = "https://uma.moe/api/v4";

    // Delay between club requests
    const REQUEST_DELAY_MS = 2000;

    // Delay between ranking lookups
    const RANKING_DELAY_MS = 500;

    const apiKeyInput = document.getElementById("apiKey");

    const searchBtn = document.getElementById("searchBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resumeBtn = document.getElementById("resumeBtn");
    const stopBtn = document.getElementById("stopBtn");
    const exportBtn = document.getElementById("exportBtn");

    const clubStatusBox = document.getElementById("clubStatus");
    const detailStatusBox = document.getElementById("detailStatus");

    const resultsBody = document.getElementById("resultsBody");

    const pageInput = document.getElementById("pageInput");

    // Runtime state
    let paused = false;
    let stopped = false;

    let searchStatus = "idle";
    /*
      Possible states:

      idle
      running
      paused
      stopped
      complete
    */

    let activeCircles = [];
    let processedIds = new Set();
    let resultsData = [];

    const searchState = {
      currentPage: 0,
      currentClubIndex: 0
    };

    function setClubStatus(text) {
      clubStatusBox.textContent = text;
    }

    function setDetailStatus(text) {
      detailStatusBox.textContent = text;
    }

    /*
      Converts:
      2026-05-11T12:00:07Z

      Into:
      2026-05-11

      Used to compare club update dates with member update dates.
    */
    function getDayNumber(isoString) {
      const date = new Date(isoString);

      return Math.floor(date.getTime() / 86400000);
    }

    function isMemberPossiblyGone(
      memberLastUpdated,
      circleLastUpdated,
      page
    ) {
      const memberDay = getDayNumber(memberLastUpdated);
      const circleDay = getDayNumber(circleLastUpdated);

      const requiredDifference = page === 0
        ? 1
        : 2;

      return (circleDay - memberDay) >= requiredDifference;
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function waitIfPaused() {
      while (paused && !stopped) {
        await sleep(200);
      }
    }

    function updateButtonStates() {
      const isRunning = searchStatus === "running";
      const isPaused = searchStatus === "paused";

      searchBtn.disabled =
        isRunning || isPaused;

      pauseBtn.disabled = !isRunning;

      resumeBtn.disabled = !isPaused;

      stopBtn.disabled =
        !(isRunning || isPaused);

      exportBtn.disabled =
        (isRunning || resultsData.length === 0);
    }

    function setSearchStatus(status) {
      searchStatus = status;
      updateButtonStates();
    }

    function clearTable() {
      resultsBody.innerHTML = "";
      resultsData = [];
    }

    function formatGain(value) {
      return typeof value === "number"
        ? value.toLocaleString()
        : value;
    }

    function escapeCsv(value) {
      return `"${String(value).replace(/"/g, '""')}"`;
    }

    /*
      Adds a new result row to the table.
    */
    function addRow(data) {
      resultsData.push(data);

      const row = document.createElement("tr");

      // Highlight rows where the player is still tied
      // to the same club ID in rankings data.
      if (
        data.previousCircleId &&
        data.currentCircleId &&
        String(data.previousCircleId) === String(data.currentCircleId)
      ) {
        row.classList.add("same-club-row");
      }

      row.innerHTML = `
        <td class="copyable-id" data-id="${data.viewerId}">
          ${data.viewerId}
        </td>
        <td>${data.trainerName}</td>
        <td>${data.previousCircleName}</td>
        <td>${data.currentCircleName}</td>
        <td>${formatGain(data.gain3d)}</td>
        <td>${formatGain(data.gain7d)}</td>
        <td>${formatGain(data.gain30d)}</td>
      `;

      const idCell = row.querySelector(".copyable-id");

      idCell.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(data.viewerId);

          idCell.classList.add("copy-flash");

          setTimeout(() => {
            idCell.classList.remove("copy-flash");
          }, 400);

        } catch (err) {
          console.error("Clipboard copy failed:", err);
        }
      });

      resultsBody.appendChild(row);
    }

    /*
      Wrapper around fetch() that automatically includes
      the API key header required by uma.moe.
    */
    async function fetchJson(url, apiKey) {
      const response = await fetch(url, {
        method: "GET",
        headers: {
          "Accept": "application/json",
          "X-API-Key": apiKey
        }
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status} while fetching ${url}`);
      }

      return await response.json();
    }

    /*
      Looks up a player's current club and recent gain stats
      using the rankings/gains endpoint.
    */
    async function fetchCurrentClub(viewerId, apiKey) {
      try {
        const data = await fetchJson(
          `${API_BASE}/rankings/gains?page=0&limit=100&query=${viewerId}&sort_by=gain_30d`,
          apiKey
        );

        if (!data.rankings || data.rankings.length === 0) {
          return null;
        }

        // rankings/gains can return partial matches,
        // so we make sure the viewer_id matches exactly.
        const player = data.rankings.find(
          ranking => String(ranking.viewer_id) === String(viewerId)
        );

        if (!player) {
          return null;
        }

        return {
          circleId: player.circle_id ?? null,
          circleName: player.circle_name || "No Club",
          gain3d: player.gain_3d ?? 0,
          gain7d: player.gain_7d ?? 0,
          gain30d: player.gain_30d ?? 0
        };

      } catch (err) {
        console.error("Ranking lookup failed:", viewerId, err);

        return {
          circleId: null,
          circleName: "Error",
          gain3d: "-",
          gain7d: "-",
          gain30d: "-"
        };
      }
    }

    function exportResultsToCsv() {
      if (resultsData.length === 0) {
        return;
      }

      const headers = [
        "viewer_id",
        "trainer_name",

        "previous_circle_id",
        "previous_circle_name",

        "current_circle_id",
        "current_circle_name",

        "gain_3d",
        "gain_7d",
        "gain_30d",

        "same_club"
      ];

      const rows = resultsData.map(row => {
        const sameClub =
          row.previousCircleId &&
          row.currentCircleId &&
          String(row.previousCircleId) ===
          String(row.currentCircleId);

        return [
          row.viewerId,
          escapeCsv(row.trainerName),

          row.previousCircleId,
          escapeCsv(row.previousCircleName),

          row.currentCircleId,
          escapeCsv(row.currentCircleName),

          row.gain3d,
          row.gain7d,
          row.gain30d,

          sameClub
        ];
      });

      const csv = [
        headers.join(","),
        ...rows.map(row => row.join(","))
      ].join("\n");

      const blob = new Blob(
        [csv],
        { type: "text/csv;charset=utf-8;" }
      );

      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");

      link.href = url;

      link.download =
        `uma-club-search-page-${searchState.currentPage}.csv`;

      document.body.appendChild(link);

      link.click();

      document.body.removeChild(link);

      URL.revokeObjectURL(url);
    }

    /*
      Main search flow:

      1. Fetch all clubs from a given page
      2. Fetch members for each club
      3. Compare member update date vs club update date
      4. If they differ, treat member as a possible leaver
      5. Look up the member's current club and gains
      6. Add result to table
    */
    async function runSearch() {
      const apiKey = apiKeyInput.value.trim();
      const page = Number(pageInput.value);

      if (!apiKey) {
        alert("Please provide an API key.");
        return;
      }

      if (
        Number.isNaN(page) ||
        page < 0 ||
        page > 1000
      ) {
        alert("Please enter a page between 0 and 1000.");
        return;
      }

      paused = false;
      stopped = false;

      setSearchStatus("running");

      clearTable();

      processedIds = new Set();
      activeCircles = [];

      searchState.currentPage = page;
      searchState.currentClubIndex = 0;

      try {
        setClubStatus(`Fetching clubs from page ${page}...`);
        setDetailStatus("");

        const circlesData = await fetchJson(
          `${API_BASE}/circles/list?page=${page}`,
          apiKey
        );

        activeCircles = circlesData.circles || [];

        for (
          let i = searchState.currentClubIndex;
          i < activeCircles.length;
          i++
        ) {
          if (stopped) {
            break;
          }

          await waitIfPaused();

          searchState.currentClubIndex = i;

          const circle = activeCircles[i];

          setClubStatus(
            `Checking club ${i + 1}/${activeCircles.length} (page ${page}): ${circle.name}`
          );

          try {
            const details = await fetchJson(
              `${API_BASE}/circles?circle_id=${circle.circle_id}`,
              apiKey
            );

            const circleLastUpdated =
              details.circle.last_updated;

            for (const member of details.members) {
              if (stopped) {
                break;
              }

              await waitIfPaused();

              /*
                Compare member update dates against the club update date.

                Page 0 clubs update very frequently, so even a
                1-day difference is suspicious.

                Lower-ranked pages update less often, so they
                require at least a 2-day difference.
              */
              if (
                isMemberPossiblyGone(
                  member.last_updated,
                  circleLastUpdated,
                  page
                )
              ) {

                if (processedIds.has(member.viewer_id)) {
                  continue;
                }

                processedIds.add(member.viewer_id);

                setDetailStatus(
                  `Checking current club for ${member.trainer_name}`
                );

                const rankingData = await fetchCurrentClub(
                  member.viewer_id,
                  apiKey
                );

                if (!rankingData) {
                  continue;
                }

                addRow({
                  viewerId: member.viewer_id,
                  trainerName: member.trainer_name,

                  previousCircleId: circle.circle_id,
                  previousCircleName: circle.name,

                  currentCircleId: rankingData.circleId,
                  currentCircleName: rankingData.circleName,

                  gain3d: rankingData.gain3d,
                  gain7d: rankingData.gain7d,
                  gain30d: rankingData.gain30d
                });

                await waitIfPaused();
                await sleep(RANKING_DELAY_MS);
              }
            }

          } catch (err) {
            console.error("Failed circle:", circle.circle_id, err);
          }

          if (
            i < activeCircles.length - 1 &&
            !stopped
          ) {
            await waitIfPaused();
            await sleep(REQUEST_DELAY_MS);
          }
        }

        if (stopped) {
          setSearchStatus("stopped");
          setClubStatus("Search stopped.");
        } else {
          setSearchStatus("complete");
          setClubStatus("Done.");
        }

        setDetailStatus("");

      } catch (err) {
        console.error(err);

        setClubStatus("Error occurred.");
        alert(err.message);
      }
    }

    searchBtn.addEventListener("click", runSearch);

    pauseBtn.addEventListener("click", () => {
      paused = true;

      setSearchStatus("paused");

      setDetailStatus("Search paused.");
    });

    resumeBtn.addEventListener("click", () => {
      paused = false;

      setSearchStatus("running");

      setDetailStatus("");
    });

    stopBtn.addEventListener("click", () => {
      stopped = true;
      paused = false;

      setDetailStatus("Stopping search...");
    });

    exportBtn.addEventListener("click", exportResultsToCsv);
  </script>

</body>
</html>
